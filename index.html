<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiom CSP — Exit Flows (interactive)</title>
<style>
  :root{
    --brand:#D9008D; --brand-pressed:#A30070; --brand-tint:#FFE5F6;
    --text-1:#161021; --text-2:#5C5570; --text-hint:#A7A1B2; --text-on-warn:#372902;
    --bg-screen:#FAF9FC; --bg-surface:#FFFFFF; --bg-neutral:#F1EDF7;
    --bg-warning:#FFF2BF; --bg-negative:#FFE5E7; --bg-positive:#E1FAED;
    --state-positive:#008043; --state-negative:#D92130; --state-caution:#E65100;
    --stroke-1:#E8E4F0; --stroke-2:#D7D3E0; --stroke-warn-focus:#FF8000;
    --r-lg:16px; --r-md:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans","Segoe UI",system-ui,sans-serif;background:var(--bg-neutral);color:var(--text-1);
    -webkit-font-smoothing:antialiased;padding:28px 16px 64px;line-height:1.45}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:22px;font-weight:800;letter-spacing:-.2px}
  .sub{color:var(--text-2);font-size:14px;margin-top:6px;max-width:700px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 4px}
  .seg{display:inline-flex;background:var(--bg-surface);border:1px solid var(--stroke-2);border-radius:999px;padding:4px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--text-2);
    padding:8px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg.flow button[aria-pressed="true"]{background:var(--text-1);color:#fff}
  .seg.scr button[aria-pressed="true"]{background:var(--brand);color:#fff}
  .hint{font-size:12px;color:var(--text-hint)}
  .stage{display:grid;grid-template-columns:390px 1fr;gap:30px;margin-top:20px;align-items:start}
  @media(max-width:820px){.stage{grid-template-columns:1fr}}
  .phone{width:390px;max-width:100%;background:var(--bg-screen);border-radius:36px;border:1px solid var(--stroke-2);
    box-shadow:0 20px 54px rgba(22,16,33,.15);overflow:hidden}
  .sb{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:700}
  .screen{min-height:720px;display:flex;flex-direction:column;position:relative}
  .body{flex:1;padding:0 22px;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 20px 16px}
  .topbar .bk{font-size:20px;color:var(--text-2);cursor:pointer}
  .topbar h2{font-size:16px;font-weight:700}

  /* Blocker (notice) */
  .notice-kicker{font-size:16px;font-weight:800;color:var(--state-negative);letter-spacing:.4px}
  .notice-rule{height:2px;background:var(--state-negative);margin:8px 0 18px}
  .headline{font-size:24px;font-weight:800;line-height:1.32;color:var(--text-1)}
  .lead{font-size:16px;color:var(--text-2);margin-top:14px;line-height:1.5}
  .statuslink{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:16px;font-weight:400;
    line-height:24px;color:var(--brand);cursor:pointer;padding:8px 0}
  .statuslink:active{opacity:.6}
  .wc-label{font-size:14px;font-weight:700;color:var(--text-hint);margin-top:30px}
  .wc-row{display:flex;align-items:center;gap:14px;padding:9px 0}
  .wc-dot{width:5px;height:5px;border-radius:50%;flex:none;background:var(--text-2)}
  .wc-row span{font-size:16px;color:var(--text-1)}
  .conseq-note{font-size:13px;color:var(--text-2);margin-top:20px;padding:12px 14px;background:var(--bg-neutral);border-radius:var(--r-md);line-height:1.45}
  .v-reason{margin-top:16px;background:var(--bg-negative);border-radius:var(--r-md);padding:12px 14px}
  .v-reason .h{font-size:13px;font-weight:800;color:var(--state-negative)}
  .v-reason .r{font-size:14px;color:var(--text-1);padding:4px 0 0}
  .contact-note{margin-top:16px;font-size:14px;color:var(--text-2);line-height:1.5}
  .spacer{flex:1;min-height:20px}
  .foot{padding:16px 22px 22px}
  .cta{display:block;width:100%;text-align:center;font-size:16px;font-weight:800;border:0;cursor:pointer;
    padding:16px;border-radius:var(--r-md);background:var(--brand);color:#fff}
  .cta:active{background:var(--brand-pressed)}
  .cta-ghost{display:block;width:100%;text-align:center;font-size:15px;font-weight:800;border:0;cursor:pointer;
    padding:14px;border-radius:var(--r-md);background:transparent;color:var(--text-2);margin-top:6px}
  .cta-ghost:active{background:var(--bg-neutral)}
  .ham{font-size:22px;color:var(--text-1);cursor:pointer;line-height:1;padding:2px 4px}
  .tap-hint{margin:20px 22px 0;font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-tint);
    border-radius:999px;padding:9px 14px;text-align:center}

  /* Hamburger drawer */
  .drawer-wrap{position:absolute;inset:0;display:flex;z-index:5}
  .drawer{width:300px;max-width:82%;background:var(--bg-surface);display:flex;flex-direction:column;
    box-shadow:2px 0 24px rgba(22,16,33,.18);animation:slideIn .18s ease}
  @keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  .dr-scrim{flex:1;background:rgba(22,16,33,.42);cursor:pointer}
  .dr-head{display:flex;align-items:center;gap:12px;padding:26px 20px 18px;border-bottom:1px solid var(--stroke-1)}
  .dr-av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;
    display:grid;place-items:center;font-size:16px;flex:none}
  .dr-name{font-size:16px;font-weight:800} .dr-role{font-size:12px;color:var(--text-2);margin-top:2px}
  .dr-list{padding:8px 0;flex:1;overflow:auto}
  .dr-item{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:15px;font-weight:600;color:var(--text-1);cursor:pointer}
  .dr-item:hover{background:var(--bg-neutral)}
  .dr-item .di-ic{font-size:17px;width:22px;text-align:center}
  .dr-exit{display:flex;align-items:center;gap:14px;padding:16px 20px;font-size:15px;font-weight:800;
    color:var(--state-negative);cursor:pointer;border-top:1px solid var(--stroke-1)}
  .dr-exit:hover{background:var(--bg-negative)} .dr-exit .cv{margin-left:auto;opacity:.5}
  .dr-exit.plain{border-top:0}
  .st-list{flex:1;overflow:auto;display:flex;flex-direction:column}
  .st-sec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--text-hint);padding:18px 20px 4px}

  /* Confirm bottom-sheet */
  .sheet-wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:6}
  .sheet-scrim{position:absolute;inset:0;background:rgba(22,16,33,.42);cursor:pointer}
  .sheet{position:relative;background:var(--bg-surface);border-radius:22px 22px 0 0;padding:10px 22px 24px;
    animation:sheetUp .2s ease}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet-grab{width:40px;height:4px;border-radius:99px;background:var(--stroke-2);margin:4px auto 16px}
  .sheet-h{font-size:19px;font-weight:800;line-height:1.35}
  .sheet-p{font-size:14px;color:var(--text-2);margin:10px 0 18px;line-height:1.5}

  /* Home + banner */
  .strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px}
  .tile{background:var(--bg-surface);border:1px solid var(--stroke-1);border-radius:var(--r-md);padding:13px 14px}
  .tile .k{font-size:12px;color:var(--text-2)} .tile .v{font-size:18px;font-weight:800;margin-top:3px}
  .banner{margin:8px 20px;border-radius:var(--r-lg);padding:14px 16px;display:flex;gap:12px;align-items:center;
    background:var(--bg-warning);cursor:pointer;transition:filter .15s, transform .06s}
  .banner:hover{filter:brightness(.97)} .banner:active{transform:scale(.99)}
  .banner .ic{font-size:16px;line-height:1.2}
  .banner .t{font-size:11px;font-weight:700;color:var(--text-on-warn);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .banner .s{font-size:12px;font-weight:700;color:var(--text-on-warn);margin-top:4px}
  .banner .cv{margin-left:auto;color:var(--text-on-warn);opacity:.55;font-size:18px}
  .empty{text-align:center;color:var(--text-2);margin-top:60px}
  .empty .h{font-size:16px;font-weight:700;color:var(--text-1)}

  /* Service status (काम की स्थिति) */
  .ss-state{margin:8px 22px 0;background:var(--bg-warning);border-radius:var(--r-md);padding:12px 14px;font-size:14px;font-weight:700;color:var(--text-on-warn);display:flex;gap:8px;align-items:center}
  .ss-secl{margin:16px 22px 0;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-hint)}
  .ss-card{margin:8px 22px 0;background:var(--bg-surface);border:1px solid var(--stroke-1);border-radius:var(--r-md);padding:2px 16px}
  .ss-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--stroke-1);gap:12px}
  .ss-row:last-child{border-bottom:0}
  .ss-row .lbl{font-size:14px;font-weight:600;color:var(--text-1)}
  .ss-row .sub{font-size:12px;color:var(--text-hint);margin-top:2px}
  .ss-row .val{font-size:17px;font-weight:800;flex:none}
  .ss-note{margin:18px 22px;font-size:13.5px;color:var(--state-caution);font-weight:600}

  /* Timeline */
  .reason{padding:14px 22px 0}
  .reason .eb{font-size:13px;font-weight:800;color:var(--state-caution)}   /* reason — ORANGE */
  .reason .hl{font-size:20px;font-weight:800;margin-top:5px;color:var(--text-1)}  /* heading — BLACK */
  .tl-anchor{font-size:15px;color:var(--text-1);font-weight:700;padding:0 22px;margin-top:4px}  /* date — BLACK */
  .tl-card{margin:16px 22px;background:var(--bg-surface);border:1px solid var(--stroke-1);border-radius:var(--r-lg);padding:18px}
  .tl-h{font-size:16px;font-weight:800;margin-bottom:14px}
  .step{display:flex;gap:13px}
  .rail{display:flex;flex-direction:column;align-items:center}
  .nd{width:14px;height:14px;border-radius:50%;margin-top:2px;flex:none;display:grid;place-items:center;font-size:10px;color:#fff}
  .line{width:2px;flex:1;background:var(--stroke-2);min-height:30px}
  .step .c{padding-bottom:18px}
  .step .lab{font-size:15px;font-weight:700;color:var(--text-1)}
  .step .lab .d{font-weight:500;color:var(--text-1);font-size:13px}   /* dates — BLACK */
  .step .aff{font-size:13px;color:var(--text-2);margin-top:2px}
  .step.up .lab{color:var(--text-hint);font-weight:500}
  .step.up .lab .d{color:var(--text-hint)}
  .abort{margin:0 22px 16px;background:var(--bg-warning);border-radius:var(--r-md);padding:14px 16px}
  .abort .ab-h{font-size:14px;font-weight:700;color:var(--text-on-warn)}
  .abort .ab-d{font-size:12.5px;color:var(--text-on-warn);opacity:.85;margin-top:4px}

  .notes h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text-hint);margin:2px 0 8px}
  .notes .box{background:var(--bg-surface);border:1px solid var(--stroke-1);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
  .notes p{font-size:13.5px;color:var(--text-2);margin:5px 0} .notes b{color:var(--text-1)}
  .tag{display:inline-block;font-size:11px;font-weight:700;background:var(--brand-tint);color:var(--brand);padding:2px 8px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Wiom CSP — Exit Flows <span style="font-weight:500;color:var(--text-hint);font-size:15px">· interactive</span></h1>
  <p class="sub">Fully clickable prototype. <b>Voluntary</b> = self-exit: start on <b>Home</b>, tap the <b>☰ hamburger</b> → <b>सेटिंग्स</b> → खाता → <b>Wiom के साथ काम बंद करें</b> → consequences → confirm → timeline. <b>B1 / B2</b> = Wiom-initiated: a full-page notice → timeline. Toggle the flow to compare.</p>

  <div class="controls">
    <div class="seg flow" role="group" aria-label="Flow">
      <button data-flow="vol" aria-pressed="true">Voluntary</button>
      <button data-flow="b1" aria-pressed="false">B1 · Viability</button>
      <button data-flow="b2" aria-pressed="false">B2 · Integrity</button>
    </div>
    <div class="seg scr" role="group" aria-label="Screen"></div>
  </div>

  <div class="stage">
    <div class="phone"><div class="sb"><span>9:41</span><span>▲ ⋯ 🔋</span></div><div class="screen" id="screen"></div></div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<script>
const WC = ["अब आपको नए काम या कनेक्शन नहीं मिलेंगे","आपके चालू काम अब Wiom का सिस्टम संभालेगा","आपका पैसा सेटल होगा और डिवाइस वापस होंगे"];
const WI_BANNER={t:"Wiom के साथ अब आपकी साझेदारी समाप्त की जा रही है", s:"स्थिति देखें"};
const FLOWS = {
  vol:{ kind:"voluntary",
    reason:"आपने खुद बाहर निकलने का फैसला किया है",
    title:"Wiom के साथ आपकी साझेदारी समाप्त हो रही है",
    intro:"बाहर निकलने से पहले समझ लें कि क्या-क्या बदलेगा:",
    consequences:["❌ नए काम मिलने बंद हो जाएंगे","📦 सभी डिवाइस वापस करने होंगे","🔄 ग्राहक दूसरे पार्टनर को चले जाएंगे","💰 वॉलेट सेटलमेंट होगा"],
    note:"ℹ️ माइग्रेशन शुरू होने से पहले तक आप कभी भी रद्द कर सकते हैं।",
    cta:"आगे बढ़ें", banner:{t:"Wiom छोड़ने की प्रक्रिया चालू है", s:"स्थिति देखें"}, abortable:true, statusLink:false,
    steps:[
      {k:"done",lab:"काम आ रहा है",d:""},
      {k:"done",lab:"बाहर निकलने का अनुरोध दर्ज",d:"16 जुलाई 2026"},
      {k:"cur", lab:"नोटिस अवधि",d:"16 – 30 जुलाई",aff:"रूटिंग और दिखावट जारी है"},
      {k:"up",  lab:"काम बंद है",d:"30 जुलाई – 2 अगस्त",aff:"नए कनेक्शन बंद"},
      {k:"up",  lab:"ग्राहक माइग्रेशन",d:"2 – 23 अगस्त",aff:"ग्राहक दूसरे पार्टनर को · वापसी संभव नहीं"},
      {k:"up",  lab:"फाइनल सेटलमेंट",d:"23 – 30 अगस्त",aff:"वॉलेट सेटलमेंट + डिवाइस वापसी"},
      {k:"up",  lab:"प्रक्रिया पूरी",d:"30 अगस्त"} ] },
  b1:{ kind:"blocker",
    reason:"कारण- काम हमेशा टारगेट से नीचे रहा",
    title:"Wiom के साथ आपका काम अब बंद किया जा रहा है।",
    anchor:"प्रक्रिया 16 जुलाई 2026 से शुरू",
    body:"पिछले 2-3 महीने से आपका काम टारगेट से नीचे रहा।",
    statusLink:true,
    cta:"ठीक है, समझ गया", banner:WI_BANNER, abortable:false,
    steps:[
      {k:"done",lab:"बाहर निकलने की प्रक्रिया शुरू",d:"16 जुलाई 2026",aff:"यहीं से समयसीमा शुरू होती है"},
      {k:"cur", lab:"काम बंद है",d:"16 जुलाई से",aff:"नए काम / कनेक्शन मिलने बंद"},
      {k:"up",  lab:"फाइनल सेटलमेंट",d:"23 – 30 जुलाई",aff:"वॉलेट सेटलमेंट + डिवाइस वापसी"},
      {k:"up",  lab:"प्रक्रिया पूरी",d:"30 जुलाई"} ] },
  b2:{ kind:"blocker",
    reason:"कारण- ग्राहक से तय कीमत से ज़्यादा पैसे लिए गए",
    title:"Wiom के साथ आपका काम अब बंद किया जा रहा है।",
    anchor:"प्रक्रिया 16 जुलाई 2026 से शुरू",
    body:"नियम तोड़ने के कारण यह फ़ैसला लिया गया है।",
    violations:["अतिरिक्त कैश — ग्राहक से तय कीमत से ज़्यादा पैसे लिए गए"],
    contactNote:"इस बारे में हमारी टीम आपसे सीधे बात करेगी।",
    statusLink:false,
    cta:"मैं समझ गया", banner:WI_BANNER, abortable:false,
    steps:[
      {k:"done",lab:"बाहर निकलने की प्रक्रिया शुरू",d:"16 जुलाई 2026",aff:"यहीं से समयसीमा शुरू होती है"},
      {k:"cur", lab:"काम बंद है",d:"16 जुलाई से",aff:"नए कनेक्शन बंद"},
      {k:"up",  lab:"सेटलमेंट + डिवाइस वापसी",d:"23 – 30 जुलाई"},
      {k:"up",  lab:"प्रक्रिया पूरी",d:"30 जुलाई"} ] }
};
const SCREENS={
  vol:[["vhome","Home"],["settings","सेटिंग्स"],["first","Consequences"],["confirm","Confirm"],["timeline","Timeline"]],
  b1:[["first","Full-page notice"],["service","सेवा स्थिति"],["home","Home banner"],["timeline","Timeline"]],
  b2:[["first","Full-page notice"],["home","Home banner"],["timeline","Timeline"]],
};
let flow="vol", screen="vhome";
const $=s=>document.querySelector(s);
function nav(s){ screen=s; sync(); render(); }
function renderTabs(){
  const seg=document.querySelector('.seg.scr');
  seg.innerHTML=SCREENS[flow].map(([k,l])=>`<button data-screen="${k}" aria-pressed="${k===screen}">${l}</button>`).join("");
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>nav(b.dataset.screen));
}
function sync(){ renderTabs(); }

function blocker(f){
  const link = f.statusLink ? `<div class="statuslink" onclick="nav('service')">अपने काम की स्थिति देखें ›</div>` : "";
  const reason = (f.violations&&f.violations.length) ? `<div class="v-reason"><div class="h">कारण</div>${f.violations.map((v,i)=>`<div class="r"${i===0?' style="font-weight:700"':""}>${v}</div>`).join("")}</div>` : "";
  const note = f.contactNote ? `<div class="contact-note">🤝 ${f.contactNote}</div>` : "";
  return `<div class="body" style="padding-top:44px">
      <div class="notice-kicker">सूचना</div>
      <div class="notice-rule"></div>
      <div class="headline">${f.title}</div>
      <div class="lead">${f.body}</div>
      ${link}${reason}${note}
      <div class="wc-label">अब क्या बदलेगा</div>
      ${WC.map(c=>`<div class="wc-row"><span class="wc-dot"></span><span>${c}</span></div>`).join("")}
      <div class="spacer"></div>
    </div>
    <div class="foot"><button class="cta" onclick="nav('timeline')">${f.cta}</button></div>`;
}
function consequences(f){
  return `<div class="topbar"><span class="bk" onclick="nav('settings')">‹</span><h2>Wiom छोड़ें</h2></div>
    <div class="body" style="padding-top:8px">
      <div class="headline" style="font-size:20px">${f.intro}</div>
      <div style="margin-top:18px">${f.consequences.map(c=>`<div class="wc-row"><span>${c}</span></div>`).join("")}</div>
      <div class="conseq-note">${f.note}</div>
      <div class="spacer"></div>
    </div>
    <div class="foot"><button class="cta" onclick="nav('confirm')">${f.cta}</button></div>`;
}
function drItem(ic,lab){return `<div class="dr-item"><span class="di-ic">${ic}</span><span>${lab}</span></div>`;}
function vhome(f){
  return `<div class="topbar"><span class="ham" onclick="nav('settings')">☰</span><h2>Rajesh Kumar · एडमिन</h2></div>
    <div class="strip">
      <div class="tile"><div class="k">कनेक्शन</div><div class="v">18<span style="color:var(--text-hint);font-size:13px">/45</span></div></div>
      <div class="tile"><div class="k">सेवा स्थिति</div><div class="v" style="color:var(--state-positive);font-size:15px">✓ ठीक है</div></div>
      <div class="tile"><div class="k">कमाई</div><div class="v">₹10,740</div></div>
      <div class="tile"><div class="k">काम की स्थिति</div><div class="v" style="color:var(--state-positive)">✓</div></div>
    </div>
    <div class="empty"><div class="h">अभी कोई काम नहीं है</div><div>काम आने पर यहाँ दिखेगा</div></div>
    <div class="tap-hint">☰ मेन्यू → सेटिंग्स → खाता → Wiom के साथ काम बंद करें</div>`;
}
// Settings screen (mirrors the app's SettingsHomeScreen). The exit lives HERE,
// inside the खाता section — not as a top-level drawer item.
function settings(f){
  return `<div class="topbar"><span class="bk" onclick="nav('vhome')">‹</span><h2>सेटिंग्स</h2></div>
    <div class="st-list">
      <div class="dr-head"><div class="dr-av">RK</div><div><div class="dr-name">Rajesh Kumar</div><div class="dr-role">एडमिन · CSP · Wiom</div></div></div>
      ${drItem("👤","प्रोफ़ाइल")}
      ${drItem("🪪","केवाईसी")}
      ${drItem("🌐","भाषा चुनें")}
      ${drItem("↩️","लॉगआउट")}
      <div class="st-sec">दस्तावेज़</div>
      ${drItem("📄","नियम व दस्तावेज़")}
      <div class="st-sec">खाता</div>
      <div class="dr-exit plain" onclick="nav('first')"><span class="di-ic">🚪</span><span>Wiom के साथ काम बंद करें</span><span class="cv">›</span></div>
    </div>`;
}
function confirm(f){
  return `<div class="sheet-wrap">
    <div class="sheet-scrim" onclick="nav('first')"></div>
    <div class="sheet">
      <div class="sheet-grab"></div>
      <div class="sheet-h">क्या आप पक्का बाहर निकलना चाहते हैं?</div>
      <div class="sheet-p">आपका अनुरोध दर्ज होगा और नोटिस अवधि शुरू हो जाएगी। माइग्रेशन शुरू होने से पहले तक आप इसे कभी भी रद्द कर सकते हैं।</div>
      <button class="cta" onclick="nav('timeline')">हाँ, बाहर निकलें</button>
      <button class="cta-ghost" onclick="nav('vhome')">रद्द करें</button>
    </div>
  </div>`;
}
function firstScreen(f){ return f.kind==="voluntary" ? consequences(f) : blocker(f); }
function service(f){
  return `<div class="topbar"><span class="bk" onclick="nav('first')">‹</span><h2>सेवा स्थिति</h2></div>
    <div class="ss-state"><span>⚠️</span><span>सेवा स्थिति खतरे में — 2 चीज़ें सुधारें</span></div>
    <div class="ss-secl">सुधारने की ज़रूरत</div>
    <div class="ss-card">
      <div class="ss-row"><div><div class="lbl">समय पर समाधान</div><div class="sub">लक्ष्य 90% से अधिक · ↓ घट रहा</div></div><span class="val" style="color:var(--state-negative)">84%</span></div>
      <div class="ss-row"><div><div class="lbl">देर तक खुली शिकायतें</div><div class="sub">लक्ष्य 5 से कम</div></div><span class="val" style="color:var(--state-negative)">9</span></div>
    </div>
    <div class="ss-secl">ठीक चल रहा है</div>
    <div class="ss-card">
      <div class="ss-row"><div><div class="lbl">समय पर इंस्टॉल</div><div class="sub">लक्ष्य 95% से अधिक</div></div><span class="val" style="color:var(--state-positive)">96%</span></div>
      <div class="ss-row"><div><div class="lbl">अपटाइम</div><div class="sub">लक्ष्य 98% से अधिक</div></div><span class="val" style="color:var(--state-positive)">99%</span></div>
      <div class="ss-row"><div><div class="lbl">सर्विस रेटिंग</div><div class="sub">लक्ष्य 4.0 से अधिक</div></div><span class="val" style="color:var(--state-positive)">4.3</span></div>
    </div>
    <div class="ss-note">⚠️ इन्हें समय रहते सुधारने से साझेदारी बच सकती थी।</div>`;
}
function home(f){
  return `<div class="topbar"><h2>Rajesh Kumar · एडमिन</h2></div>
    <div class="strip">
      <div class="tile"><div class="k">कनेक्शन</div><div class="v">18<span style="color:var(--text-hint);font-size:13px">/45</span></div></div>
      <div class="tile"><div class="k">सेवा स्थिति</div><div class="v" style="color:var(--state-caution);font-size:15px">⚠️ 2 समस्याएं</div></div>
      <div class="tile"><div class="k">कमाई</div><div class="v">₹10,740</div></div>
      <div class="tile"><div class="k">काम की स्थिति</div><div class="v" style="color:var(--state-positive)">✓</div></div>
    </div>
    <div class="banner" onclick="nav('timeline')"><span class="ic">⚠️</span><div style="min-width:0"><div class="t">${f.banner.t}</div><div class="s">${f.banner.s}</div></div><span class="cv">›</span></div>
    <div class="empty"><div class="h">अभी कोई काम नहीं है</div><div>काम आने पर यहाँ दिखेगा</div></div>`;
}
function nodeEl(kind){
  if(kind==="done")return `<div class="nd" style="background:var(--state-positive)">✓</div>`;
  if(kind==="cur") return `<div class="nd" style="background:var(--brand)"></div>`;
  return `<div class="nd" style="background:var(--stroke-2)"></div>`;
}
function timeline(f){
  const rows=f.steps.map((s,i)=>`<div class="step ${s.k==='up'?'up':''}">
      <div class="rail">${nodeEl(s.k)}${i===f.steps.length-1?"":'<div class="line"></div>'}</div>
      <div class="c"><div class="lab">${s.lab}${s.d?` <span class="d">· ${s.d}</span>`:""}</div>${s.aff?`<div class="aff">${s.aff}</div>`:""}</div></div>`).join("");
  const abort = f.abortable ? `<div class="abort"><div class="ab-h">⚠️ अभी भी अपना निर्णय बदल सकते हैं</div><div class="ab-d">माइग्रेशन शुरू होने से पहले तक रद्द कर सकते हैं</div></div>` : "";
  return `<div class="topbar"><span class="bk" onclick="nav('${flow==='vol'?'vhome':'home'}')">‹</span><h2>बाहर निकलने की स्थिति</h2></div>
    <div class="reason"><div class="eb">${f.reason}</div><div class="hl">${f.title}</div></div>
    ${f.anchor?`<div class="tl-anchor">${f.anchor}</div>`:""}
    <div class="tl-card" style="margin-top:16px"><div class="tl-h">आगे क्या होगा</div>${rows}</div>
    ${abort}`;
}

function renderScreen(f){
  switch(screen){
    case "vhome":   return vhome(f);
    case "settings":return settings(f);
    case "confirm": return confirm(f);
    case "service": return service(f);
    case "home":    return home(f);
    case "timeline":return timeline(f);
    default:        return firstScreen(f);
  }
}
function render(){
  const f=FLOWS[flow];
  $("#screen").innerHTML = renderScreen(f);
  const d={
    vol:"CSP-initiated · cancelable. <b>Home ☰ → मेन्यू → Wiom छोड़ें</b> → consequences → confirm sheet → abortable timeline.",
    b1:"Underperformance · no blame. Notice + a link to <b>काम की स्थिति</b> (why), then the exit timeline.",
    b2:"Rule violation · final. Reason is shown (Enforcement OS · FPV): the <b>violation type</b> + a direct-contact line to contest. <span class='tag'>FPV: reason in-app</span>",
  };
  const inter={
    vol:`<p><b>☰ hamburger</b> (top-left) → opens <b>सेटिंग्स</b>.</p>
      <p>In Settings, scroll to <b>खाता</b> → <b>Wiom के साथ काम बंद करें</b> (red) → <b>consequences</b>.</p>
      <p><b>आगे बढ़ें</b> → <b>confirm sheet</b> → <b>हाँ, बाहर निकलें</b> → timeline.</p>
      <p><b>रद्द करें</b> → back to home. <b>‹ back</b> arrows navigate too.</p>`,
    b1:`<p><b>CTA</b> → opens the <b>exit timeline</b>.</p>
      <p><b>अपने काम की स्थिति देखें</b> → <b>service status</b> page.</p>
      <p><b>Home banner</b> → exit timeline.</p>`,
    b2:`<p><b>CTA</b> → opens the <b>exit timeline</b>.</p>
      <p><b>Home banner</b> → exit timeline. <b>‹ back</b> arrows navigate too.</p>`,
  };
  $("#notes").innerHTML=`
    <h3>Interactions (click the phone)</h3>
    <div class="box">${inter[flow]}</div>
    <h3>Timeline styling</h3>
    <div class="box"><p><b style="color:var(--state-caution)">कारण-…</b> reason is <b>orange</b>; the heading &amp; dates are <b>black</b>.</p></div>
    <h3>${flow==="vol"?"Voluntary (self-exit)":flow==="b2"?"B2 · Integrity":"B1 · Viability"}</h3>
    <div class="box"><p>${d[flow]}</p></div>`;
}
document.querySelectorAll(".seg.flow button").forEach(b=>b.onclick=()=>{flow=b.dataset.flow; screen=SCREENS[flow][0][0];
  document.querySelectorAll(".seg.flow button").forEach(x=>x.setAttribute("aria-pressed",x===b)); sync(); render();});
sync(); render();
</script>
</body>
</html>
